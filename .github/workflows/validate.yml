name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill structure
        run: python scripts/validate.py
      - name: README skill index is current
        run: python scripts/readme-index.py --check
      - name: Unit tests (run-evals.py, mock backend; no model is called)
        run: python -m unittest discover -s tests

  cross-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite
      - uses: actions/checkout@v4
        with:
          repository: Lolisuki18/dev-workflow-skills
          path: repos/dev-workflow-skills
      - uses: actions/checkout@v4
        with:
          repository: Lolisuki18/pull-request-skills
          path: repos/pull-request-skills
      - uses: actions/checkout@v4
        with:
          repository: Lolisuki18/qa-workflow-skills
          path: repos/qa-workflow-skills
      - uses: actions/checkout@v4
        with:
          repository: Lolisuki18/docs-workflow-skills
          path: repos/docs-workflow-skills
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check names, links and URLs across the five repos
        run: python suite/scripts/check-links.py --dirs suite repos/dev-workflow-skills repos/pull-request-skills repos/qa-workflow-skills repos/docs-workflow-skills
